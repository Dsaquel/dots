font_family      family="Monaspace Argon Var" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss09"
bold_font        family="Monaspace Argon Var" style=Bold features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss09"
italic_font      family="Monaspace Radon Var" style=Italic features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss09"
bold_italic_font family="Monaspace Radon Var" style="Bold Italic" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss09"
font_size        12.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
symbol_map U+2609,U+263D Cardo
symbol_map U+2717 DejaVu Sans Mono

cursor_blink_interval 0
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.06 0.24
repaint_delay 6
window_padding_width 18 20

background_opacity 0.92
background_blur 1
dynamic_background_opacity yes

tab_bar_edge bottom
tab_bar_min_tabs 2
tab_bar_align left
tab_bar_margin_width 6.0
tab_bar_margin_height 6.0 0.0
tab_activity_symbol none
bell_on_tab no
tab_separator ""
tab_title_max_length 28
tab_title_template "{title}"
active_tab_font_style   bold
inactive_tab_font_style normal

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

map kitty_mod+enter new_window_with_cwd
map cmd+enter       new_window_with_cwd
map kitty_mod+n next_window
map kitty_mod+p previous_window
map kitty_mod+h kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

map kitty_mod+k combine : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up
map kitty_mod+j combine : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down

scrollback_pager nvim -c "normal G" -
scrollback_lines 10000

globinclude theme.conf
globinclude local.conf

window_alert_on_bell no

filter_notification title:"Claude Code" or body:"Claude is waiting for your input"
