source = ~/.config/hypr/hyprlock-active.conf
source = ~/.cache/glasshouse/hyprlock-screens.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 2500
}

animations {
    enabled = true
    bezier = glassOut, 0.33, 1, 0.68, 1
    animation = fadeIn, 1, 6, glassOut
    animation = fadeOut, 1, 5, glassOut
    animation = inputFieldFade, 1, 5, glassOut
    animation = inputFieldColors, 1, 6, glassOut
    animation = inputFieldDots, 1, 3, glassOut
}

background {
    monitor =
    path = $wallpaper
    color = $ground
    blur_passes = 0
    zindex = -1
}
background {
    monitor = $side_output
    path = $side
    color = $ground
    blur_passes = 0
    zindex = -1
}

image {
    monitor = $main_output
    path = $overlay_main
    size = 1080
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}
image {
    monitor = $side_output
    path = $overlay_side
    size = 1080
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor = $main_output
    text = $TIME
    color = $ink
    font_size = 117
    font_family = $numerals
    position = -204, 172
    halign = right
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    zindex = 1
}

label {
    monitor = $main_output
    text = cmd[update:60000] LC_ALL=C date '+%^A  %-d  %^B' | sed 's/^/<span letter_spacing="4200">/; s/$/<\/span>/'
    color = $caps
    font_size = 11
    font_family = $caps_font
    position = -204, 88
    halign = right
    valign = center
    zindex = 1
}

label {
    monitor = $main_output
    text = <span letter_spacing="5000">PRESS ANY KEY</span>
    color = $hint
    font_size = 9
    font_family = $caps_font
    position = -204, 29
    halign = right
    valign = center
    zindex = 1
}

input-field {
    monitor = $main_output
    size = 430, 60
    position = -204, 22
    halign = right
    valign = center
    outline_thickness = 3
    rounding = 13
    outer_color = $metal
    inner_color = $glass
    font_color = $field_ink
    font_family = $ui
    dots_text_format = $dot
    dots_size = 0.36
    dots_spacing = 0.32
    dots_center = true
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    hide_input = false
    check_color = $gold
    fail_color = $alert
    fail_text = <span letter_spacing="3000">$FAIL</span>
    capslock_color = $gold
    zindex = 2
}
